<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ePub/Markdown 翻译工具</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // 检查jQuery是否加载成功
        window.addEventListener('load', function() {
            if (typeof jQuery === 'undefined') {
                console.error('jQuery 未加载成功');
                alert('jQuery 未加载成功，请检查网络连接');
            } else {
                console.log('jQuery 加载成功，版本:', jQuery.fn.jquery);
            }
        });
    </script>
    <style>
        /* 保留一些自定义样式用于过渡 */
        .custom-transition {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- 导航栏 -->
        <div class="flex justify-center space-x-4 mb-8">
            <a href="/" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition-colors duration-200">首页</a>
            <a href="/epub-markdown" class="bg-blue-600 text-white px-4 py-2 rounded-md">ePub/Markdown 翻译</a>
            <a href="/pdf" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition-colors duration-200">PDF 翻译</a>
        </div>

        <h1 class="text-3xl font-bold text-gray-800 text-center mb-8">ePub/Markdown 翻译工具</h1>

        <!-- 文件上传区域 -->
        <form id="upload-form" enctype="multipart/form-data">
            <div id="drop-area" class="border-2 border-dashed border-blue-400 rounded-xl p-10 text-center mb-6 bg-blue-50 transition-all duration-300">
                <div id="drop-content">
                    <div class="text-5xl text-blue-500 mb-4">📚</div>
                    <p class="text-xl font-semibold text-gray-700 mb-3">拖放ePub/Markdown文件到此处</p>
                    <p class="text-gray-500 mb-6">支持格式: .epub, .md, .markdown, .txt</p>
                    <input type="file" name="file" accept=".epub,.md,.markdown,.txt" id="file-input" class="hidden">
                    <button type="button" id="browse-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-medium transition-colors duration-200">选择文件</button>
                </div>
                <div id="file-info-drop" class="hidden">
                    <div class="text-3xl text-green-500 mb-3">✓</div>
                    <p class="font-semibold text-gray-700 mb-2">文件已选择</p>
                    <p id="selected-filename" class="text-gray-500"></p>
                    <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg mt-4 transition-colors duration-200">上传文件</button>
                </div>
            </div>
        </form>

        <!-- 文件信息区域 -->
        <div id="file-info" class="hidden bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="space-y-4">
                <div>
                    <p class="text-gray-700"><span class="font-semibold">文件名:</span> <span id="filename" class="text-blue-600"></span></p>
                    <p class="text-gray-700"><span class="font-semibold">文件类型:</span> <span id="file-type" class="text-blue-600"></span></p>
                </div>

                <div>
                    <label for="target-language" class="block text-sm font-medium text-gray-700 mb-1">目标语言:</label>
                    <select id="target-language" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="中文" selected>中文</option>
                        <option value="英文">英文</option>
                        <option value="日文">日文</option>
                    </select>
                </div>

                <div>
                    <label for="service-select" class="block text-sm font-medium text-gray-700 mb-1">翻译服务:</label>
                    <select id="service-select" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">加载中...</option>
                    </select>
                </div>

                <!-- Ollama 配置 -->
                <div id="ollama-config" class="hidden space-y-3 p-4 bg-gray-50 rounded-lg">
                    <div>
                        <label for="ollama-url" class="block text-sm font-medium text-gray-700 mb-1">Ollama URL:</label>
                        <input type="text" id="ollama-url" value="http://localhost:11434/api/generate" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="ollama-model" class="block text-sm font-medium text-gray-700 mb-1">Ollama 模型名称:</label>
                        <input type="text" id="ollama-model" value="qwen2.5:7b" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <div class="flex space-x-3">
                    <button id="translate-btn" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-medium transition-colors duration-200">开始翻译</button>
                    <button id="abort-btn" class="hidden bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-lg font-medium transition-colors duration-200">中止翻译</button>
                </div>
            </div>
        </div>

        <!-- 进度区域 -->
        <div id="progress" class="hidden bg-white rounded-xl shadow-md p-6 mb-6">
            <p id="progress-text" class="text-center font-semibold text-gray-700 mb-4">翻译准备中...</p>

            <div id="file-info-details" class="mb-4 p-4 bg-gray-50 rounded-lg">
                <p class="font-semibold text-gray-700 mb-2">文件信息:</p>
                <div class="space-y-1 text-sm text-gray-600">
                    <p>文件名: <span id="detail-filename" class="font-medium"></span></p>
                    <p>文件类型: <span id="detail-file-type" class="font-medium"></span></p>
                    <p>文件大小: <span id="detail-file-size" class="font-medium"></span></p>
                </div>
            </div>

            <div class="font-semibold text-gray-700 mb-2">翻译进度日志:</div>
            <div id="progress-details" class="max-h-80 overflow-y-auto bg-gray-50 p-4 rounded-lg border border-gray-200 font-mono text-sm space-y-2"></div>
        </div>

        <!-- 结果区域 -->
        <div id="result" class="hidden bg-green-50 border border-green-200 rounded-xl p-6 text-center">
            <p class="text-green-700">翻译完成。<a id="download-link" href="#" class="text-green-600 hover:text-green-800 font-semibold underline">下载结果</a></p>
        </div>

        <!-- 错误区域 -->
        <div id="error" class="hidden bg-red-50 border border-red-200 rounded-xl p-6">
            <p class="text-red-700 font-semibold">翻译失败: <span id="error-message" class="font-normal"></span></p>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            console.log('DOM ready, jQuery version:', $.fn.jquery);
            
            // 拖放上传功能
            const dropArea = document.getElementById('drop-area');
            const fileInput = document.getElementById('file-input');
            const browseBtn = document.getElementById('browse-btn');
            const dropContent = document.getElementById('drop-content');
            const fileInfoDrop = document.getElementById('file-info-drop');
            const selectedFilename = document.getElementById('selected-filename');

            // 防止默认拖放行为
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            // 高亮拖放区域
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });

            // 处理文件放置
            dropArea.addEventListener('drop', handleDrop, false);

            // 点击浏览按钮
            browseBtn.addEventListener('click', () => {
                fileInput.click();
            });

            // 文件选择变化
            fileInput.addEventListener('change', handleFileSelect);

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            function highlight() {
                dropArea.classList.remove('border-blue-400', 'bg-blue-50');
                dropArea.classList.add('border-green-400', 'bg-green-50');
            }

            function unhighlight() {
                dropArea.classList.remove('border-green-400', 'bg-green-50');
                dropArea.classList.add('border-blue-400', 'bg-blue-50');
            }

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            }

            function handleFileSelect(e) {
                const files = e.target.files;
                handleFiles(files);
            }

            function handleFiles(files) {
                if (files.length > 0) {
                    const file = files[0];
                    const allowedTypes = [
                        'application/epub+zip',
                        'text/markdown',
                        'text/plain',
                        'application/octet-stream' // 对于某些文件类型
                    ];
                    
                    const allowedExtensions = ['.epub', '.md', '.markdown', '.txt'];
                    const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
                    
                    if (!allowedExtensions.includes(fileExtension) && !allowedTypes.includes(file.type)) {
                        alert('请选择支持的格式: .epub, .md, .markdown, .txt');
                        return;
                    }
                    
                    // 显示文件信息
                    selectedFilename.textContent = file.name;
                    dropContent.classList.add('hidden');
                    fileInfoDrop.classList.remove('hidden');
                    
                    // 设置文件输入
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    fileInput.files = dataTransfer.files;
                }
            }

            // 上传表单提交
            $(document).on('submit', '#upload-form', function(e) {
                e.preventDefault();
                
                if (!fileInput.files.length) {
                    alert('请选择一个文件');
                    return;
                }
                
                var formData = new FormData(this);
                var file = fileInput.files[0];
                
                console.log('开始上传文件:', file.name);
                $('#detail-file-size').text(formatFileSize(file.size));
                
                // 显示上传中状态
                var uploadBtn = $(this).find('button[type="submit"]');
                var originalText = uploadBtn.text();
                uploadBtn.text('上传中...').prop('disabled', true);
                
                $.ajax({
                    url: '/epub-markdown',
                    type: 'POST',
                    data: formData,
                    contentType: false,
                    processData: false,
                    success: function(response) {
                        console.log('上传成功:', response);
                        $('#filename').text(response.filename);
                        $('#file-type').text(response.file_type);
                        $('#detail-filename').text(response.filename);
                        $('#detail-file-type').text(response.file_type);
                        $('#file-info').removeClass('hidden');
                        currentFileUploaded = true;

                        // 重置拖放区域
                        dropContent.classList.remove('hidden');
                        fileInfoDrop.classList.add('hidden');
                        
                        // 重置后端进度状态
                        $.post('/reset-progress');
                        
                        // 恢复按钮状态
                        uploadBtn.text(originalText).prop('disabled', false);
                    },
                    error: function(xhr, status, error) {
                        console.error('上传失败:', xhr.responseText);
                        var errorMsg = '上传失败';
                        try {
                            var response = JSON.parse(xhr.responseText);
                            errorMsg = response.error || errorMsg;
                        } catch(e) {
                            errorMsg = '上传失败: ' + error;
                        }
                        alert(errorMsg);
                        
                        // 恢复按钮状态
                        uploadBtn.text(originalText).prop('disabled', false);
                    }
                });
            });
            
            // 跟踪当前是否有文件上传
            var currentFileUploaded = false;
            // Load available translation services
            $.get('/services', function(services) {
                var serviceSelect = $('#service-select');
                serviceSelect.empty();
                
                if (Object.keys(services).length === 0) {
                    serviceSelect.append('<option value="">无可用服务</option>');
                } else {
                    for (var name in services) {
                        var service = services[name];
                        var displayName = name + ' (' + service.service_type + ')';
                        if (service.model_name) {
                            displayName += ' - ' + service.model_name;
                        }
                        serviceSelect.append('<option value="' + name + '">' + displayName + '</option>');
                    }
                }
                
                // Show/hide ollama config based on selection
                serviceSelect.change(function() {
                    var selectedService = services[$(this).val()];
                    if (selectedService && selectedService.service_type === 'ollama') {
                        $('#ollama-config').removeClass('hidden');
                    } else {
                        $('#ollama-config').addClass('hidden');
                    }
                });
            }).fail(function() {
                $('#service-select').html('<option value="">加载服务失败</option>');
            });
            

            $('#translate-btn').click(function() {
                var data = {
                    filename: $('#filename').text(),
                    target_language: $('#target-language').val(),
                    service_name: $('#service-select').val(),
                    ollama_url: $('#ollama-url').val(),
                    ollama_model: $('#ollama-model').val()
                };
                $('#progress').removeClass('hidden');
                $('#translate-btn').addClass('hidden');
                $('#abort-btn').removeClass('hidden');
                $('#progress-details').html(''); // 清空之前的日志
                $.ajax({
                    url: '/translate-epub-markdown',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function(response) {
                        if (response.status === 'started') {
                            connectToProgressStream();
                        }
                    }
                });
            });

            $('#abort-btn').click(function() {
                if (confirm('确定要中止当前翻译吗？已翻译的内容将不会保存。')) {
                    $.post('/abort-translation', function(response) {
                        if (response.status === 'aborted') {
                            $('#progress-text').text('翻译已中止');
                            $('#progress-details').append('<span class="text-red-500">[用户中止] 翻译已被用户中止</span><br>');
                            $('#translate-btn').removeClass('hidden');
                            $('#abort-btn').addClass('hidden');

                            // 3秒后隐藏进度区域
                            setTimeout(function() {
                                $('#progress').addClass('hidden');
                            }, 3000);
                        }
                    }).fail(function() {
                        alert('中止请求失败，请重试');
                    });
                }
            });
            
            // 页面加载时检查是否有进行中的翻译，并自动连接
            function checkExistingProgress() {
                $.get('/progress-status', function(status) {
                    // 只有在有当前文件上传或者翻译正在进行中时才显示进度
                    // 对于完成状态，只有当有当前文件上传时才显示（避免显示历史完成状态）
                    var shouldShowProgress = status.status === 'in_progress' || 
                                           (currentFileUploaded && (status.status === 'complete' || status.status === 'error'));
                    
                    if (shouldShowProgress) {
                        $('#progress').removeClass('hidden');
                        
                        // 显示已有的进度消息
                        if (status.messages && status.messages.length > 0) {
                            if (status.status === 'complete') {
                                // 只有在有当前文件上传时才显示完成状态
                                if (currentFileUploaded) {
                                    $('#progress-text').text('翻译完成！');
                                    $('#progress-details').hide();
                                    setTimeout(function() {
                                        $('#progress').addClass('hidden');
                                        $('#download-link').attr('href', '/download/' + status.result_file);
                                        $('#result').removeClass('hidden');
                                    }, 1000);
                                } else {
                                    // 没有当前文件，隐藏完成状态
                                    $('#progress').addClass('hidden');
                                }
                            } else if (status.status === 'error') {
                                // 只有在有当前文件上传时才显示错误状态
                                if (currentFileUploaded) {
                                    $('#progress-text').text('翻译失败！');
                                    $('#progress-details').hide();
                                    $('#error-message').text(status.error_message);
                                    $('#error').removeClass('hidden');
                                } else {
                                    // 没有当前文件，隐藏错误状态
                                    $('#progress').addClass('hidden');
                                }
                            } else {
                                // 进行中状态，总是显示
                                $('#progress-text').text('翻译进行中...');
                                $('#progress-details').html('');
                                
                                // 添加所有历史消息
                                status.messages.forEach(function(message) {
                                    var timestamp = new Date().toLocaleTimeString();
                                    var formattedMessage = '<span style="color: #666; font-size: 12px;">[' + timestamp + ']</span> ' + message;
                                    $('#progress-details').append(formattedMessage + '<br>');
                                });
                                
                                // 自动滚动到最新消息（底部）
                                var progressDiv = $('#progress-details')[0];
                                progressDiv.scrollTop = progressDiv.scrollHeight;
                            }
                        }
                        
                        // 只有进行中的翻译才需要连接SSE
                        if (status.status === 'in_progress') {
                            connectToProgressStream();
                        }
                    }
                }).fail(function() {
                    console.log('No existing progress found');
                });
            }
            
            // 连接进度流
            function connectToProgressStream() {
                console.log('Connecting to progress stream...');
                var eventSource = new EventSource('/progress');
                eventSource.onerror = function(e) {
                    console.error('SSE connection error:', e);
                    console.log('EventSource readyState:', eventSource.readyState);
                };
                eventSource.onopen = function(e) {
                    console.log('SSE connection opened');
                };
                eventSource.onmessage = function(e) {
                    console.log('Received SSE message:', e.data);
                    if (e.data.startsWith('complete:')) {
                        $('#progress-text').text('翻译完成！');
                        $('#progress-details').prepend(formatLogMessage('success', '翻译任务已完成'));
                        setTimeout(function() {
                            $('#progress').addClass('hidden');
                            $('#download-link').attr('href', '/download/' + e.data.split(':')[1]);
                            $('#result').removeClass('hidden');
                        }, 1000);
                        eventSource.close();
                    } else if (e.data.startsWith('error:')) {
                        $('#progress-text').text('翻译失败！');
                        $('#progress-details').prepend(formatLogMessage('error', e.data.split(':')[1]));
                        $('#error-message').text(e.data.split(':')[1]);
                        $('#error').removeClass('hidden');
                        $('#translate-btn').removeClass('hidden');
                        $('#abort-btn').addClass('hidden');
                        eventSource.close();
                    } else if (e.data.startsWith('aborted:')) {
                        $('#progress-text').text('翻译已中止');
                        $('#progress-details').prepend(formatLogMessage('error', e.data.split(':')[1]));
                        $('#translate-btn').removeClass('hidden');
                        $('#abort-btn').addClass('hidden');
                        eventSource.close();
                    } else {
                        // 显示详细的翻译进度信息
                        $('#progress-text').text('翻译进行中...');

                        // 智能识别消息类型
                        var message = e.data;
                        var type = 'info';
                        if (message.includes('完成') || message.includes('成功')) {
                            type = 'success';
                        } else if (message.includes('警告') || message.includes('注意')) {
                            type = 'warning';
                        } else if (message.includes('错误') || message.includes('失败')) {
                            type = 'error';
                        }

                        $('#progress-details').prepend(formatLogMessage(type, message));

                        // 自动滚动到最新消息（顶部）
                        var progressDiv = $('#progress-details')[0];
                        progressDiv.scrollTop = 0;

                        // 限制显示的行数，保留更多历史
                        var entries = $('#progress-details').children();
                        if (entries.length > 20) {
                            entries.slice(20).remove();
                        }
                    }
                };
            }
            
            // 页面加载时检查现有进度
            checkExistingProgress();
            
            // 文件大小格式化函数
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        });

        // 日志格式化函数
        function formatLogMessage(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            const typeClasses = {
                'info': 'flex items-start space-x-2 py-1 px-3 rounded-md border-l-4 border-blue-400 bg-blue-50 text-blue-700',
                'success': 'flex items-start space-x-2 py-1 px-3 rounded-md border-l-4 border-green-400 bg-green-50 text-green-700',
                'warning': 'flex items-start space-x-2 py-1 px-3 rounded-md border-l-4 border-yellow-400 bg-yellow-50 text-yellow-700',
                'error': 'flex items-start space-x-2 py-1 px-3 rounded-md border-l-4 border-red-400 bg-red-50 text-red-700'
            };

            return `
                <div class="log-entry ${typeClasses[type]} transition-colors duration-200">
                    <span class="timestamp text-gray-500 text-xs font-medium flex-shrink-0">[${timestamp}]</span>
                    <span class="message flex-1">${message}</span>
                </div>
            `;
        }
    </script>
</body>
</html>
