<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档翻译工具</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon/android-chrome-512x512.png">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* 保留一些自定义样式用于过渡 */
        .custom-transition {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8 relative">
        <!-- 管理页面入口 -->
        <div class="absolute top-0 right-0 mt-4 mr-4">
            <a href="/admin/" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-md font-medium transition-colors duration-200 shadow-sm hover:shadow-md">
                管理页面
            </a>
        </div>

        <h1 class="text-3xl font-bold text-gray-800 text-center mb-8">文档翻译工具</h1>

        <div class="bg-white rounded-xl shadow-md p-8 mb-6 text-center">
            <h2 class="text-xl font-semibold text-gray-700 mb-6">选择要翻译的文件类型</h2>

            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/epub-markdown" class="bg-green-500 hover:bg-green-600 text-white px-8 py-4 rounded-lg font-semibold text-lg shadow-md hover:shadow-lg transform hover:-translate-y-1 transition-all duration-300 min-w-[200px] inline-block text-center">
                    ePub/Markdown 翻译
                    <div class="text-green-100 text-sm mt-2">支持 .epub, .md, .markdown, .txt 文件</div>
                </a>

                <a href="/pdf" class="bg-red-500 hover:bg-red-600 text-white px-8 py-4 rounded-lg font-semibold text-lg shadow-md hover:shadow-lg transform hover:-translate-y-1 transition-all duration-300 min-w-[200px] inline-block text-center">
                    PDF 翻译
                    <div class="text-red-100 text-sm mt-2">支持 .pdf 文件</div>
                </a>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">使用说明</h2>
            <ul class="text-gray-600 space-y-2 text-left">
                <li><strong class="text-green-600">推荐使用 ePub/Markdown 翻译</strong> - 处理更快，支持更多格式</li>
                <li>PDF 翻译需要处理页面布局，可能较慢</li>
                <li>支持多种翻译服务（DeepSeek、Ollama等）</li>
                <li>翻译结果可下载为文本文件</li>
            </ul>
        </div>
    </div>
</body>
</html>
