<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ePub 翻译工具</title>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // 检查jQuery是否加载成功
        window.addEventListener('load', function() {
            if (typeof jQuery === 'undefined') {
                console.error('jQuery 未加载成功');
                alert('jQuery 未加载成功，请检查网络连接');
            } else {
                console.log('jQuery 加载成功，版本:', jQuery.fn.jquery);
            }
        });
    </script>
    <style>
        /* 保留一些自定义样式用于过渡 */
        .custom-transition {
            transition: all 0.3s ease;
        }

        /* 响应式标题样式 */
        @media (max-width: 640px) {
            .title-responsive {
                font-size: 1.5rem; /* 24px */
                line-height: 1.2;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- 导航栏 -->
        <div class="flex justify-center space-x-4 mb-8">
            <a href="/" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition-colors duration-200">首页</a>
            <a href="/epub" class="bg-blue-600 text-white px-4 py-2 rounded-md">ePub 翻译</a>
            <a href="/markdown" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition-colors duration-200">Markdown 翻译</a>
            <a href="/pdf" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition-colors duration-200">PDF 翻译</a>
        </div>

        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 text-center mb-2 title-responsive">📚 ePub 翻译工具</h1>
        <p class="text-center text-gray-600 mb-8">专业电子书翻译，支持保持书籍结构和元数据</p>

        <!-- 文件上传区域 -->
        <form id="upload-form" enctype="multipart/form-data">
            <div id="drop-area" class="border-2 border-dashed border-blue-400 rounded-xl p-10 text-center mb-6 bg-blue-50 transition-all duration-300">
                <div id="drop-content">
                    <div class="text-5xl text-blue-500 mb-4">📚</div>
                    <p class="text-xl font-semibold text-gray-700 mb-3">拖放 ePub 文件到此处</p>
                    <p class="text-gray-500 mb-6">支持格式: .epub</p>
                    <input type="file" name="file" accept=".epub" id="file-input" class="hidden">
                    <button type="button" id="browse-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-medium transition-colors duration-200">选择文件</button>
                </div>
                <div id="file-info-drop" class="hidden">
                    <div class="text-3xl text-green-500 mb-3">✓</div>
                    <p class="font-semibold text-gray-700 mb-2">文件已选择</p>
                    <p id="selected-filename" class="text-gray-500"></p>
                    <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg mt-4 transition-colors duration-200">上传文件</button>
                </div>
            </div>
        </form>

        <!-- 文件信息区域（上传后显示） -->
        <div id="file-info" class="hidden bg-white rounded-xl shadow-md p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-3">已上传文件</h3>
            <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
                <p class="text-gray-700"><span class="font-semibold">文件名:</span> <span id="filename" class="text-blue-600"></span></p>
                <p class="text-gray-700"><span class="font-semibold">文件类型:</span> <span id="file-type" class="text-blue-600"></span></p>
            </div>
        </div>

        <!-- 翻译配置区域（始终可见） -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">翻译配置</h3>
            <div class="space-y-4">
                <div>
                    <label for="target-language" class="block text-sm font-medium text-gray-700 mb-1">目标语言:</label>
                    <select id="target-language" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="中文" selected>中文</option>
                        <option value="英文">英文</option>
                        <option value="日文">日文</option>
                    </select>
                </div>

                <div>
                    <label for="source-language" class="block text-sm font-medium text-gray-700 mb-1">源语言:</label>
                    <select id="source-language" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="auto" selected>自动检测</option>
                        <option value="英文">英文</option>
                        <option value="中文">中文</option>
                        <option value="日文">日文</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">输出模式:</label>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="output_mode" value="translation_only" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300" checked>
                            <div>
                                <span class="text-sm font-medium text-gray-700">仅译文</span>
                                <span class="text-xs text-gray-500 block">仅生成翻译后的文本</span>
                            </div>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="output_mode" value="bilingual" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                            <div>
                                <span class="text-sm font-medium text-gray-700">双语对照</span>
                                <span class="text-xs text-gray-500 block">生成包含原文和译文的对照版本</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label for="service-select" class="block text-sm font-medium text-gray-700 mb-1">翻译服务:</label>
                    <select id="service-select" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">加载中...</option>
                    </select>
                </div>
            </div>
        </div>

                <div>
                    <label for="prompt-template" class="block text-sm font-medium text-gray-700 mb-1">提示词模板:</label>
                    <select id="prompt-template" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">加载中...</option>
                    </select>
                    <p class="text-xs text-gray-500 mt-1">选择适合书籍类型的翻译提示词模板</p>
                </div>

                <div id="custom-prompt-section" class="hidden">
                    <label for="custom-prompt" class="block text-sm font-medium text-gray-700 mb-1">自定义提示词:</label>
                    <textarea id="custom-prompt" rows="6" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm" placeholder="输入自定义提示词..."></textarea>
                    <div class="mt-2 flex items-center justify-between">
                        <p class="text-xs text-gray-500">可用变量: {source_language}, {target_language}, {chunk}</p>
                        <button type="button" id="reset-prompt-btn" class="text-xs text-blue-600 hover:text-blue-800">重置为模板</button>
                    </div>
                </div>

                <!-- Ollama 配置 -->
                <div id="ollama-config" class="hidden space-y-3 p-4 bg-gray-50 rounded-lg">
                    <div>
                        <label for="ollama-url" class="block text-sm font-medium text-gray-700 mb-1">Ollama URL:</label>
                        <input type="text" id="ollama-url" value="http://localhost:11434/api/generate" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="ollama-model" class="block text-sm font-medium text-gray-700 mb-1">Ollama 模型名称:</label>
                        <input type="text" id="ollama-model" value="qwen2.5:7b" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <div class="flex space-x-3">
                    <button id="translate-btn" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-medium transition-colors duration-200">开始翻译</button>
                    <button id="abort-btn" class="hidden bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-lg font-medium transition-colors duration-200">中止翻译</button>
                </div>
            </div>
        </div>

        <!-- 进度区域 -->
        <div id="progress" class="hidden bg-white rounded-xl shadow-md p-6 mb-6">
            <p id="progress-text" class="text-center font-semibold text-gray-700 mb-4">翻译准备中...</p>

            <div id="file-info-details" class="mb-4 p-4 bg-gray-50 rounded-lg">
                <p class="font-semibold text-gray-700 mb-2">文件信息:</p>
                <div class="space-y-1 text-sm text-gray-600">
                    <p>文件名: <span id="detail-filename" class="font-medium"></span></p>
                    <p>文件类型: <span id="detail-file-type" class="font-medium"></span></p>
                    <p>文件大小: <span id="detail-file-size" class="font-medium"></span></p>
                </div>
            </div>

            <!-- 翻译进度条 -->
            <div id="progress-bar-container" class="mb-4 hidden">
                <div class="flex justify-between items-center mb-2">
                    <div class="font-semibold text-gray-700">翻译进度:</div>
                    <div id="progress-percentage" class="text-sm font-medium text-blue-600">0%</div>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                    <div id="progress-bar" class="h-3 bg-blue-500 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
                </div>
                <div id="progress-status" class="mt-2 text-sm text-gray-600 text-center">准备中...</div>
            </div>

            <div class="font-semibold text-gray-700 mb-2">翻译进度日志:</div>
            <div id="progress-details" class="max-h-80 overflow-y-auto bg-gray-50 p-4 rounded-lg border border-gray-200 font-mono text-sm space-y-2"></div>
        </div>

        <!-- 结果区域 -->
        <div id="result" class="hidden bg-green-50 border border-green-200 rounded-xl p-6 text-center">
            <p class="text-green-700">翻译完成。<a id="download-link" href="#" class="text-green-600 hover:text-green-800 font-semibold underline">下载结果</a></p>
        </div>

        <!-- 错误区域 -->
        <div id="error" class="hidden bg-red-50 border border-red-200 rounded-xl p-6">
            <p class="text-red-700 font-semibold">翻译失败: <span id="error-message" class="font-normal"></span></p>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            console.log('DOM ready, jQuery version:', $.fn.jquery);

            // 🧹 页面刷新或切换时清空文件缓存
            // 强制刷新页面时清空缓存
            window.addEventListener('beforeunload', function() {
                localStorage.removeItem('lastUploadedFile');
            });

            // 页面切换时清空缓存（点击导航链接时）
            $('a[href^="/"], a[href^="http"]').on('click', function(e) {
                // 清除文件上传缓存
                localStorage.removeItem('lastUploadedFile');
            });

            // 页面变为可见时（从其他页面切换回来）清空缓存
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    // 从其他页面切换回来，清空缓存
                    localStorage.removeItem('lastUploadedFile');
                }
            });

            // 恢复上次上传的文件（如果有）
            var lastFile = localStorage.getItem('lastUploadedFile');
            if (lastFile) {
                try {
                    var fileData = JSON.parse(lastFile);
                    // 检查文件是否在24小时内上传（避免显示过旧的文件）
                    var hoursPassed = (Date.now() - fileData.timestamp) / (1000 * 60 * 60);
                    if (hoursPassed < 24) {
                        console.log('恢复上次上传的文件:', fileData.filename);
                        $('#filename').text(fileData.filename);
                        $('#file-type').text(fileData.fileType);
                        $('#detail-filename').text(fileData.filename);
                        $('#detail-file-type').text(fileData.fileType);
                        $('#file-info').removeClass('hidden');
                        currentFileUploaded = true;
                    } else {
                        // 清除过期的记录
                        localStorage.removeItem('lastUploadedFile');
                    }
                } catch(e) {
                    console.error('恢复文件信息失败:', e);
                    localStorage.removeItem('lastUploadedFile');
                }
            }

            // 跟踪当前翻译进度
            var currentProgress = {
                percentage: 0,
                status: '准备中...',
                isComplete: false,
                isError: false,
                isAborted: false
            };

            // 拖放上传功能
            const dropArea = document.getElementById('drop-area');
            const fileInput = document.getElementById('file-input');
            const browseBtn = document.getElementById('browse-btn');
            const dropContent = document.getElementById('drop-content');
            const fileInfoDrop = document.getElementById('file-info-drop');
            const selectedFilename = document.getElementById('selected-filename');

            // 防止默认拖放行为
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            // 高亮拖放区域
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });

            // 处理文件放置
            dropArea.addEventListener('drop', handleDrop, false);

            // 点击浏览按钮
            browseBtn.addEventListener('click', () => {
                fileInput.click();
            });

            // 文件选择变化
            fileInput.addEventListener('change', handleFileSelect);

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            function highlight() {
                dropArea.classList.remove('border-blue-400', 'bg-blue-50');
                dropArea.classList.add('border-green-400', 'bg-green-50');
            }

            function unhighlight() {
                dropArea.classList.remove('border-green-400', 'bg-green-50');
                dropArea.classList.add('border-blue-400', 'bg-blue-50');
            }

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            }

            function handleFileSelect(e) {
                const files = e.target.files;
                handleFiles(files);
            }

            function handleFiles(files) {
                if (files.length > 0) {
                    const file = files[0];
                    const allowedExtensions = ['.epub'];
                    const fileExtension = '.' + file.name.split('.').pop().toLowerCase();

                    if (!allowedExtensions.includes(fileExtension)) {
                        alert('请选择 ePub 文件 (.epub)');
                        return;
                    }

                    // 显示文件信息
                    selectedFilename.textContent = file.name;
                    dropContent.classList.add('hidden');
                    fileInfoDrop.classList.remove('hidden');

                    // 设置文件输入
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    fileInput.files = dataTransfer.files;
                }
            }

            // 上传表单提交
            $(document).on('submit', '#upload-form', function(e) {
                e.preventDefault();

                if (!fileInput.files.length) {
                    alert('请选择一个 ePub 文件');
                    return;
                }

                var formData = new FormData(this);
                var file = fileInput.files[0];

                console.log('开始上传文件:', file.name);
                $('#detail-file-size').text(formatFileSize(file.size));

                // 显示上传中状态
                var uploadBtn = $(this).find('button[type="submit"]');
                var originalText = uploadBtn.text();
                uploadBtn.text('上传中...').prop('disabled', true);

                $.ajax({
                    url: '/epub',
                    type: 'POST',
                    data: formData,
                    contentType: false,
                    processData: false,
                    success: function(response) {
                        console.log('上传成功:', response);
                        $('#filename').text(response.filename);
                        $('#file-type').text(response.file_type);
                        $('#detail-filename').text(response.filename);
                        $('#detail-file-type').text(response.file_type);
                        $('#file-info').removeClass('hidden');
                        currentFileUploaded = true;

                        // 保存到localStorage以便页面刷新后恢复
                        localStorage.setItem('lastUploadedFile', JSON.stringify({
                            filename: response.filename,
                            fileType: response.file_type,
                            timestamp: Date.now()
                        }));

                        // 重置拖放区域
                        dropContent.classList.remove('hidden');
                        fileInfoDrop.classList.add('hidden');

                        // 重置后端进度状态
                        $.post('/api/reset-progress');

                        // 🔧 重要：重置界面状态，显示"开始翻译"按钮
                        // 隐藏结果和错误区域
                        $('#result').addClass('hidden');
                        $('#error').addClass('hidden');

                        // 隐藏进度区域
                        $('#progress').addClass('hidden');

                        // 显示翻译按钮，隐藏中止按钮
                        $('#translate-btn').removeClass('hidden');
                        $('#abort-btn').addClass('hidden');

                        // 重置进度条
                        $('#progress-bar-container').addClass('hidden');
                        $('#progress-details').html('');

                        // 重置进度跟踪
                        resetProgressTracking();

                        // 恢复按钮状态
                        uploadBtn.text(originalText).prop('disabled', false);
                    },
                    error: function(xhr, status, error) {
                        console.error('上传失败:', xhr.responseText);
                        var errorMsg = '上传失败';
                        try {
                            var response = JSON.parse(xhr.responseText);
                            errorMsg = response.error || errorMsg;
                        } catch(e) {
                            errorMsg = '上传失败: ' + error;
                        }
                        alert(errorMsg);

                        // 恢复按钮状态
                        uploadBtn.text(originalText).prop('disabled', false);
                    }
                });
            });

            // 跟踪当前是否有文件上传
            var currentFileUploaded = false;

            // 存储提示词模板
            var promptTemplates = {};

            // Load available translation services
            var servicesMap = {};  // 存储服务映射，用于后续访问
            $.get('/api/services', function(response) {
                var serviceSelect = $('#service-select');
                serviceSelect.empty();

                var services = response.services || [];
                var defaultService = response.default_service;

                if (services.length === 0) {
                    serviceSelect.append('<option value="">无可用服务</option>');
                } else {
                    services.forEach(function(service) {
                        var name = service.name;
                        servicesMap[name] = service;  // 存储到映射
                        var displayName = name + ' (' + service.service_type + ')';
                        if (service.model_name) {
                            displayName += ' - ' + service.model_name;
                        }
                        var selected = (defaultService && defaultService.name === name) ? ' selected' : '';
                        serviceSelect.append('<option value="' + name + '"' + selected + '>' + displayName + '</option>');
                    });
                }

                // Show/hide ollama config based on selection
                serviceSelect.change(function() {
                    var selectedService = servicesMap[$(this).val()];
                    if (selectedService && selectedService.service_type === 'ollama') {
                        $('#ollama-config').removeClass('hidden');
                    } else {
                        $('#ollama-config').addClass('hidden');
                    }
                });
            }).fail(function() {
                $('#service-select').html('<option value="">加载服务失败</option>');
            });

            // Load prompt templates
            $.get('/prompt-templates', function(response) {
                promptTemplates = response.templates || {};
                var templateSelect = $('#prompt-template');
                templateSelect.empty();

                // 添加"无"选项
                templateSelect.append('<option value="">使用默认提示词</option>');

                for (var key in promptTemplates) {
                    var template = promptTemplates[key];
                    templateSelect.append('<option value="' + key + '">' + template.name + '</option>');
                }

                // 默认选择epub模板
                if (promptTemplates['epub']) {
                    templateSelect.val('epub');
                    $('#custom-prompt').val(promptTemplates['epub'].template);
                }
            }).fail(function() {
                $('#prompt-template').html('<option value="">加载模板失败</option>');
            });

            // Handle template selection
            $('#prompt-template').change(function() {
                var selectedKey = $(this).val();
                if (selectedKey && promptTemplates[selectedKey]) {
                    $('#custom-prompt').val(promptTemplates[selectedKey].template);
                    $('#custom-prompt-section').removeClass('hidden');
                } else {
                    $('#custom-prompt-section').addClass('hidden');
                }
            });

            // Reset prompt button
            $('#reset-prompt-btn').click(function() {
                var selectedKey = $('#prompt-template').val();
                if (selectedKey && promptTemplates[selectedKey]) {
                    $('#custom-prompt').val(promptTemplates[selectedKey].template);
                }
            });

            // 输出模式切换事件 - 重置翻译状态
            $('input[name="output_mode"]').change(function() {
                console.log('切换输出模式:', $(this).val());

                // 隐藏结果和错误区域
                $('#result').addClass('hidden');
                $('#error').addClass('hidden');

                // 重置进度区域
                $('#progress-bar-container').addClass('hidden');
                $('#progress-details').html('');

                // 显示翻译按钮，隐藏中止按钮
                $('#translate-btn').removeClass('hidden');
                $('#abort-btn').addClass('hidden');

                // 重置进度跟踪
                resetProgressTracking();
            });

            $('#translate-btn').click(function() {
                var currentFilename = $('#filename').text();
                console.log('当前文件名:', currentFilename);

                // 验证文件名
                if (!currentFilename) {
                    alert('请先上传文件');
                    return;
                }

                var data = {
                    filename: currentFilename,
                    target_language: $('#target-language').val(),
                    source_language: $('#source-language').val(),
                    bilingual: $('input[name="output_mode"]:checked').val() === 'bilingual',
                    service_name: $('#service-select').val(),
                    ollama_url: $('#ollama-url').val(),
                    ollama_model: $('#ollama-model').val(),
                    prompt_template: $('#prompt-template').val(),
                    custom_prompt: $('#custom-prompt').val()
                };

                $('#progress').removeClass('hidden');
                $('#translate-btn').addClass('hidden');
                $('#abort-btn').removeClass('hidden');
                $('#progress-details').html(''); // 清空之前的日志
                $('#progress-bar-container').removeClass('hidden'); // 显示进度条
                resetProgressTracking(); // 重置进度跟踪
                updateProgressBar(0, '准备开始翻译...', true); // 强制初始化进度条

                $.ajax({
                    url: '/api/translate-epub',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function(response) {
                        if (response.status === 'success') {
                            connectToProgressStream();
                        }
                    }
                });
            });

            $('#abort-btn').click(function() {
                if (confirm('确定要中止当前翻译吗？已翻译的内容将不会保存。')) {
                    $.post('/api/abort-translation', function(response) {
                        if (response.status === 'aborted') {
                            $('#progress-text').text('翻译已中止');
                            updateProgressBar(0, '翻译已中止', true); // 强制重置
                            $('#progress-bar').removeClass('bg-blue-500 bg-green-500').addClass('bg-red-500'); // 进度条变红色
                            currentProgress.isAborted = true;
                            $('#progress-details').append('<span class="text-red-500">[用户中止] 翻译已被用户中止</span><br>');
                            $('#translate-btn').removeClass('hidden');
                            $('#abort-btn').addClass('hidden');

                            // 3秒后隐藏进度区域和重置进度条
                            setTimeout(function() {
                                $('#progress').addClass('hidden');
                                $('#progress-bar-container').addClass('hidden');
                                $('#progress-bar').removeClass('bg-red-500').addClass('bg-blue-500'); // 重置为蓝色
                            }, 3000);
                        }
                    }).fail(function() {
                        alert('中止请求失败，请重试');
                    });
                }
            });

            // 页面加载时检查是否有进行中的翻译，并自动连接
            function checkExistingProgress() {
                $.get('/progress-status', function(status) {
                    var shouldShowProgress = status.status === 'in_progress' ||
                                           (currentFileUploaded && (status.status === 'complete' || status.status === 'error'));

                    if (shouldShowProgress) {
                        $('#progress').removeClass('hidden');

                        // 显示已有的进度消息
                        if (status.messages && status.messages.length > 0) {
                            if (status.status === 'complete') {
                                if (currentFileUploaded) {
                                    $('#progress-text').text('翻译完成！');
                                    $('#progress-details').hide();
                                    setTimeout(function() {
                                        $('#progress').addClass('hidden');
                                        $('#download-link').attr('href', '/api/download/' + status.result_file);
                                        $('#result').removeClass('hidden');
                                    }, 1000);
                                } else {
                                    $('#progress').addClass('hidden');
                                }
                            } else if (status.status === 'error') {
                                if (currentFileUploaded) {
                                    $('#progress-text').text('翻译失败！');
                                    $('#progress-details').hide();
                                    $('#error-message').text(status.error_message);
                                    $('#error').removeClass('hidden');
                                } else {
                                    $('#progress').addClass('hidden');
                                }
                            } else {
                                $('#progress-text').text('翻译进行中...');
                                $('#progress-details').html('');

                                // 添加所有历史消息
                                status.messages.forEach(function(message) {
                                    var timestamp = new Date().toLocaleTimeString();
                                    var formattedMessage = '<span style="color: #666; font-size: 12px;">[' + timestamp + ']</span> ' + message;
                                    $('#progress-details').append(formattedMessage + '<br>');
                                });

                                // 自动滚动到最新消息（底部）
                                var progressDiv = $('#progress-details')[0];
                                progressDiv.scrollTop = progressDiv.scrollHeight;
                            }
                        }

                        // 只有进行中的翻译才需要连接SSE
                        if (status.status === 'in_progress') {
                            connectToProgressStream();
                        }
                    }
                }).fail(function() {
                    console.log('No existing progress found');
                });
            }

            // 连接进度流
            function connectToProgressStream() {
                console.log('Connecting to progress stream...');
                var eventSource = new EventSource('/api/progress');
                eventSource.onerror = function(e) {
                    console.error('SSE connection error:', e);
                    console.log('EventSource readyState:', eventSource.readyState);
                };
                eventSource.onopen = function(e) {
                    console.log('SSE connection opened');
                };
                eventSource.onmessage = function(e) {
                    console.log('Received SSE message:', e.data);
                    if (e.data.startsWith('complete:')) {
                        $('#progress-text').text('翻译完成！');
                        updateProgressBar(100, '翻译已完成！', true); // 强制更新到100%
                        $('#progress-bar').removeClass('bg-blue-500').addClass('bg-green-500'); // 进度条变绿色
                        currentProgress.isComplete = true;
                        $('#progress-details').prepend(formatLogMessage('success', '翻译任务已完成'));
                        setTimeout(function() {
                            $('#progress').addClass('hidden');
                            $('#download-link').attr('href', '/api/download/' + e.data.split(':')[1]);
                            $('#result').removeClass('hidden');
                        }, 1000);
                        eventSource.close();
                    } else if (e.data.startsWith('error:')) {
                        $('#progress-text').text('翻译失败！');
                        updateProgressBar(0, '翻译失败', true); // 强制重置
                        $('#progress-bar').removeClass('bg-blue-500 bg-green-500').addClass('bg-red-500'); // 进度条变红色
                        currentProgress.isError = true;
                        $('#progress-details').prepend(formatLogMessage('error', e.data.split(':')[1]));
                        $('#error-message').text(e.data.split(':')[1]);
                        $('#error').removeClass('hidden');
                        $('#translate-btn').removeClass('hidden');
                        $('#abort-btn').addClass('hidden');
                        setTimeout(function() {
                            $('#progress-bar-container').addClass('hidden');
                            $('#progress-bar').removeClass('bg-red-500').addClass('bg-blue-500'); // 重置为蓝色
                        }, 2000);
                        eventSource.close();
                    } else if (e.data.startsWith('aborted:')) {
                        $('#progress-text').text('翻译已中止');
                        updateProgressBar(0, '翻译已中止', true); // 强制重置
                        $('#progress-bar').removeClass('bg-blue-500 bg-green-500').addClass('bg-red-500'); // 进度条变红色
                        currentProgress.isAborted = true;
                        $('#progress-details').prepend(formatLogMessage('error', e.data.split(':')[1]));
                        $('#translate-btn').removeClass('hidden');
                        $('#abort-btn').addClass('hidden');
                        setTimeout(function() {
                            $('#progress-bar-container').addClass('hidden');
                            $('#progress-bar').removeClass('bg-red-500').addClass('bg-blue-500'); // 重置为蓝色
                        }, 2000);
                        eventSource.close();
                    } else {
                        // 显示详细的翻译进度信息
                        $('#progress-text').text('翻译进行中...');

                        // 智能识别消息类型
                        var message = e.data;
                        var type = 'info';
                        if (message.includes('完成') || message.includes('成功')) {
                            type = 'success';
                        } else if (message.includes('警告') || message.includes('注意')) {
                            type = 'warning';
                        } else if (message.includes('错误') || message.includes('失败')) {
                            type = 'error';
                        }

                        // 尝试从消息中解析进度信息并更新进度条
                        var progressInfo = parseProgressFromMessage(message);
                        if (progressInfo) {
                            if (progressInfo.percentage !== null) {
                                // 有百分比信息，更新进度
                                updateProgressBar(progressInfo.percentage, progressInfo.status);
                            } else {
                                // 只有状态信息，更新状态但不更新百分比
                                currentProgress.status = progressInfo.status;
                                $('#progress-status').text(progressInfo.status);
                                console.log(`[进度条] 更新状态: ${progressInfo.status}`);
                            }
                        }

                        $('#progress-details').prepend(formatLogMessage(type, message));

                        // 自动滚动到最新消息（顶部）
                        var progressDiv = $('#progress-details')[0];
                        progressDiv.scrollTop = 0;

                        // 限制显示的行数，保留更多历史
                        var entries = $('#progress-details').children();
                        if (entries.length > 20) {
                            entries.slice(20).remove();
                        }
                    }
                };
            }

            // 页面加载时检查现有进度
            checkExistingProgress();

            // 文件大小格式化函数
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        });

        // 进度条更新函数
        function updateProgressBar(percentage, status, force) {
            // 如果不是强制更新，且新进度小于当前进度，则忽略（防止倒退）
            if (!force && percentage < currentProgress.percentage) {
                console.log(`[进度条] 忽略倒退进度: ${percentage}% < ${currentProgress.percentage}%`);
                return;
            }

            percentage = Math.max(0, Math.min(100, percentage)); // 确保百分比在0-100范围内

            // 更新跟踪对象
            currentProgress.percentage = percentage;
            if (status) {
                currentProgress.status = status;
            }

            // 更新UI
            $('#progress-percentage').text(Math.round(percentage) + '%');
            $('#progress-bar').css('width', percentage + '%');
            $('#progress-status').text(currentProgress.status);

            console.log(`[进度条] 更新进度: ${percentage}% - ${currentProgress.status}`);
        }

        // 重置进度跟踪
        function resetProgressTracking() {
            currentProgress = {
                percentage: 0,
                status: '准备中...',
                isComplete: false,
                isError: false,
                isAborted: false
            };
            console.log('[进度条] 重置进度跟踪');
        }

        // 解析进度信息从消息中
        function parseProgressFromMessage(message) {
            // 记录原始消息用于调试
            console.log(`[进度条] 解析消息: "${message}"`);

            // 尝试匹配 "已完成 X/Y" 格式
            const completedMatch = message.match(/已完成\s*(\d+)\s*\/\s*(\d+)/);
            if (completedMatch) {
                const completed = parseInt(completedMatch[1]);
                const total = parseInt(completedMatch[2]);

                // 验证数据的合理性
                if (total > 0 && completed >= 0 && completed <= total) {
                    const percentage = (completed / total) * 100;
                    const result = {
                        percentage: percentage,
                        status: `已完成 ${completed} 个章节，共 ${total} 个章节`
                    };
                    console.log(`[进度条] 解析结果: ${result.percentage}% - ${result.status}`);
                    return result;
                } else {
                    console.log(`[进度条] 无效的章节数据: ${completed}/${total}`);
                }
            }

            // 尝试匹配 "X%" 格式
            const percentMatch = message.match(/(\d+)%/);
            if (percentMatch) {
                const percentage = parseInt(percentMatch[1]);
                // 验证百分比合理性
                if (percentage >= 0 && percentage <= 100) {
                    const result = {
                        percentage: percentage,
                        status: `翻译进度: ${percentage}%`
                    };
                    console.log(`[进度条] 解析结果: ${result.percentage}% - ${result.status}`);
                    return result;
                } else {
                    console.log(`[进度条] 无效的百分比: ${percentage}%`);
                }
            }

            // 尝试匹配 "翻译完成第 X 章" 格式
            const chapterMatch = message.match(/翻译完成第\s*(\d+)\s*章/);
            if (chapterMatch) {
                const chapter = parseInt(chapterMatch[1]);
                if (chapter > 0) {
                    const result = {
                        percentage: null, // 未知总章节数，不更新百分比
                        status: `正在翻译第 ${chapter} 章...`
                    };
                    console.log(`[进度条] 解析结果: 章节进度 - ${result.status}`);
                    return result;
                }
            }

            console.log('[进度条] 消息中未包含进度信息');
            return null;
        }

        // 日志格式化函数
        function formatLogMessage(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            const typeClasses = {
                'info': 'flex items-start space-x-2 py-1 px-3 rounded-md border-l-4 border-blue-400 bg-blue-50 text-blue-700',
                'success': 'flex items-start space-x-2 py-1 px-3 rounded-md border-l-4 border-green-400 bg-green-50 text-green-700',
                'warning': 'flex items-start space-x-2 py-1 px-3 rounded-md border-l-4 border-yellow-400 bg-yellow-50 text-yellow-700',
                'error': 'flex items-start space-x-2 py-1 px-3 rounded-md border-l-4 border-red-400 bg-red-50 text-red-700'
            };

            return `
                <div class="log-entry ${typeClasses[type]} transition-colors duration-200">
                    <span class="timestamp text-gray-500 text-xs font-medium flex-shrink-0">[${timestamp}]</span>
                    <span class="message flex-1">${message}</span>
                </div>
            `;
        }
    </script>
</body>
</html>
