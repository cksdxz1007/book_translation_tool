<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译结果 - 智能文档翻译工具</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <style>
        .hover-card {
            transition: all 0.3s ease;
        }
        .hover-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center">
                        <svg class="h-8 w-8 text-indigo-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
                        </svg>
                        <h1 class="text-xl font-bold text-gray-800">智能文档翻译</h1>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="flex items-center px-4 py-2 text-sm font-medium text-indigo-600 hover:text-indigo-800">
                        <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                        返回主页
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-900">翻译结果列表</h2>
            <p class="text-sm text-gray-500 mt-1">以下列出 data/results 目录中的所有翻译结果文件</p>
        </div>

        <!-- 文件列表 -->
        <div id="fileList" class="space-y-4">
            <div class="text-center py-12 text-gray-500">
                <svg class="h-16 w-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                </svg>
                <p>正在加载...</p>
            </div>
        </div>

        <!-- 分页 -->
        <div id="pagination" class="mt-6 flex justify-center hidden">
            <div class="flex space-x-2">
                <button id="prevBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    上一页
                </button>
                <span id="pageInfo" class="px-4 py-2 text-sm text-gray-600"></span>
                <button id="nextBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    下一页
                </button>
            </div>
        </div>
    </main>

    <script>
        const ITEMS_PER_PAGE = 10;
        let allFiles = [];
        let currentPage = 1;

        // 文件类型映射
        const fileTypeMap = {
            'pdf': { icon: '📄', color: 'bg-red-100 text-red-700', name: 'PDF文档' },
            'epub': { icon: '📚', color: 'bg-purple-100 text-purple-700', name: 'EPUB电子书' },
            'md': { icon: '📝', color: 'bg-blue-100 text-blue-700', name: 'Markdown' }
        };

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }

        // 格式化日期
        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN');
        }

        // 获取文件扩展名
        function getFileType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return fileTypeMap[ext] || { icon: '📄', color: 'bg-gray-100 text-gray-700', name: '其他文件' };
        }

        // 渲染文件列表
        function renderFileList(files) {
            const container = document.getElementById('fileList');

            if (files.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <svg class="h-16 w-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                        </svg>
                        <p class="text-lg font-medium">暂无翻译结果</p>
                        <p class="text-sm mt-2">请先上传文件进行翻译</p>
                        <a href="/" class="inline-block mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                            前往翻译
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = files.map(file => {
                const typeInfo = getFileType(file.name);
                const downloadUrl = `/api/translate/download-by-file/${encodeURIComponent(file.name)}`;

                return `
                    <div class="bg-white shadow-lg rounded-xl p-6 hover-card">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center flex-1">
                                <div class="text-3xl mr-4">${typeInfo.icon}</div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="text-lg font-semibold text-gray-900 truncate" title="${file.name}">
                                        ${file.name}
                                    </h3>
                                    <div class="flex items-center space-x-4 mt-1 text-sm text-gray-500">
                                        <span class="px-2 py-0.5 rounded-full text-xs ${typeInfo.color}">${typeInfo.name}</span>
                                        <span>${formatFileSize(file.size)}</span>
                                        <span>${formatDate(file.mtime)}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-3 ml-4">
                                <a href="${downloadUrl}" class="flex items-center px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors text-sm font-medium">
                                    <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                    </svg>
                                    下载
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 加载文件列表
        async function loadFiles() {
            try {
                const response = await fetch('/api/translate/results-list');
                const data = await response.json();

                if (data.status === 'success') {
                    allFiles = data.files;
                    renderPage(1);
                } else {
                    document.getElementById('fileList').innerHTML = `
                        <div class="text-center py-12 text-red-500">
                            <p>加载失败: ${data.error || '未知错误'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载文件列表失败:', error);
                document.getElementById('fileList').innerHTML = `
                    <div class="text-center py-12 text-red-500">
                        <p>加载失败: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 渲染分页
        function renderPage(page) {
            currentPage = page;
            const start = (page - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageFiles = allFiles.slice(start, end);

            renderFileList(pageFiles);

            const totalPages = Math.ceil(allFiles.length / ITEMS_PER_PAGE);
            const pagination = document.getElementById('pagination');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');

            if (totalPages > 1) {
                pagination.classList.remove('hidden');
                prevBtn.disabled = page === 1;
                nextBtn.disabled = page === totalPages;
                pageInfo.textContent = `第 ${page} / ${totalPages} 页，共 ${allFiles.length} 个文件`;
            } else {
                pagination.classList.add('hidden');
            }
        }

        // 上一页
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                renderPage(currentPage - 1);
            }
        });

        // 下一页
        document.getElementById('nextBtn').addEventListener('click', () => {
            const totalPages = Math.ceil(allFiles.length / ITEMS_PER_PAGE);
            if (currentPage < totalPages) {
                renderPage(currentPage + 1);
            }
        });

        // 页面加载时获取文件列表
        document.addEventListener('DOMContentLoaded', loadFiles);
    </script>
</body>
</html>
