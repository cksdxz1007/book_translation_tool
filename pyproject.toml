[project]
name = "book-translation-tool"
version = "2.0.0"
description = "Flask-based document translation tool with multi-engine support"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Claude Code", email = "noreply@anthropic.com"}
]
license = {text = "MIT"}
keywords = ["flask", "translation", "pdf", "epub", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "flask>=2.3.0",
    "werkzeug>=2.3.0",
    "requests>=2.31.0",
    "openai>=1.3.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "pypdf>=3.17.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
    "mistune>=3.0.0",
    "jinja2>=3.1.0",
    "cssutils>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]
babeldoc = [
    "babeldoc>=0.5.0",
]
full = [
    "babeldoc>=0.5.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]

[project.urls]
Homepage = "https://github.com/anthropics/book-translation-tool"
Documentation = "https://github.com/anthropics/book-translation-tool/blob/master/README.md"
Repository = "https://github.com/anthropics/book-translation-tool.git"
Issues = "https://github.com/anthropics/book-translation-tool/issues"

[project.scripts]
book-translate = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app", "translator", "admin_routes"]
